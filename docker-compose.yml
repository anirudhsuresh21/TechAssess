version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: techassess-mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=techassess
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: techassess-api
    restart: always
    ports:
      - '4000:4000'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/techassess
      - JWT_SECRET=techassess-secure-recruitment-secret-key-2026
      - CORS_ORIGIN=http://localhost:3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: techassess-web
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000

volumes:
  mongo-data:
    driver: local
